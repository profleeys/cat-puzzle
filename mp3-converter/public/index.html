<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 MP3 轉換器</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #7c3aed;
      --accent2: #a855f7;
      --success: #10b981;
      --danger: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d2d50;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 40px; }
    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    header p { color: var(--muted); font-size: 1rem; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent2);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .tab:hover:not(.active) { border-color: var(--accent2); color: var(--accent2); }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent2);
      background: rgba(124, 58, 237, 0.06);
    }
    .drop-zone .icon { font-size: 3rem; margin-bottom: 12px; }
    .drop-zone p { color: var(--muted); font-size: 0.9rem; }
    .drop-zone strong { color: var(--accent2); }
    #fileInput { display: none; }

    /* ── URL input ── */
    .input-row { display: flex; gap: 10px; }
    .input-field {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--accent); }
    .input-field::placeholder { color: var(--muted); }

    /* ── Buttons ── */
    .btn {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-success {
      background: var(--success);
      color: #fff;
      width: 100%;
      justify-content: center;
      font-size: 1rem;
    }
    .btn-success:hover { opacity: 0.88; }
    .btn-success:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Media info ── */
    .media-info {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      gap: 14px;
      align-items: flex-start;
    }
    .media-info.visible { display: flex; }
    .media-info img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .media-meta { flex: 1; min-width: 0; }
    .media-meta .name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .media-meta .dur { color: var(--muted); font-size: 0.85rem; }

    /* ── Range section ── */
    .range-section { margin-top: 20px; }
    .range-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .range-toggle input[type="checkbox"] { display: none; }
    .toggle-pill {
      width: 42px; height: 24px;
      background: var(--border);
      border-radius: 12px;
      position: relative;
      transition: background 0.2s;
    }
    .toggle-pill::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input[type="checkbox"]:checked + .toggle-pill { background: var(--accent); }
    input[type="checkbox"]:checked + .toggle-pill::after { transform: translateX(18px); }
    .range-toggle-label { font-weight: 600; font-size: 0.95rem; }
    .range-inputs {
      display: none;
      margin-top: 16px;
      gap: 12px;
    }
    .range-inputs.visible { display: flex; }
    .time-input-wrap { flex: 1; }
    .time-input-wrap label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* ── Waveform / visual bar ── */
    .timeline-wrap {
      display: none;
      margin-top: 16px;
    }
    .timeline-wrap.visible { display: block; }
    .timeline-bar-outer {
      height: 48px;
      background: var(--surface2);
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .timeline-bg {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 8px;
    }
    .wave-bar {
      flex: 1;
      background: var(--border);
      border-radius: 2px;
    }
    .timeline-selection {
      position: absolute;
      top: 0; bottom: 0;
      background: rgba(124, 58, 237, 0.3);
      border-left: 2px solid var(--accent2);
      border-right: 2px solid var(--accent2);
      pointer-events: none;
    }
    .timeline-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
      text-align: center;
    }

    /* ── Progress & status ── */
    .status-box {
      display: none;
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      align-items: center;
      gap: 10px;
    }
    .status-box.visible { display: flex; }
    .status-box.loading {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid #6366f1;
      color: #a5b4fc;
    }
    .status-box.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
    .status-box.success-msg {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(165,180,252,0.3);
      border-top-color: #a5b4fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Convert button area ── */
    .convert-section { margin-top: 24px; }

    /* ── Footer ── */
    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>🎵 MP3 轉換器</h1>
  <p>上傳音訊 / 視訊檔案，或貼上 YouTube 連結，一鍵轉成 MP3</p>
</header>

<!-- ── Source Card ── -->
<div class="card">
  <div class="card-title">📥 選擇來源</div>

  <div class="tabs">
    <div class="tab active" id="tabFile" onclick="switchTab('file')">📂 上傳檔案</div>
    <div class="tab" id="tabYt" onclick="switchTab('youtube')">▶️ YouTube 連結</div>
  </div>

  <!-- File panel -->
  <div id="panelFile">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
         ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <div class="icon">📁</div>
      <p><strong>點擊選擇</strong>或拖曳檔案至此</p>
      <p style="margin-top:6px;font-size:0.82rem;">支援 MP3、MP4、WAV、FLAC、AAC、MKV、MOV 等格式（最大 500 MB）</p>
    </div>
    <input type="file" id="fileInput" accept="audio/*,video/*" onchange="handleFileSelect(this)"/>
    <div class="media-info" id="fileInfo">
      <div class="media-meta">
        <div class="name" id="fileName">-</div>
        <div class="dur" id="fileDur">-</div>
      </div>
    </div>
  </div>

  <!-- YouTube panel -->
  <div id="panelYt" style="display:none;">
    <div class="input-row">
      <input class="input-field" type="url" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." />
      <button class="btn btn-primary" onclick="fetchYtInfo()">取得資訊</button>
    </div>
    <div class="media-info" id="ytInfo">
      <img id="ytThumb" src="" alt="縮圖" />
      <div class="media-meta">
        <div class="name" id="ytTitle">-</div>
        <div class="dur" id="ytDur">-</div>
      </div>
    </div>
    <div class="status-box" id="ytStatus"></div>
  </div>
</div>

<!-- ── Trim Card ── -->
<div class="card">
  <div class="card-title">✂️ 擷取區間（可選）</div>

  <label class="range-toggle">
    <input type="checkbox" id="trimToggle" onchange="toggleTrim(this)"/>
    <div class="toggle-pill"></div>
    <span class="range-toggle-label">啟用區間擷取</span>
  </label>

  <div class="range-inputs" id="rangeInputs">
    <div class="time-input-wrap">
      <label>開始時間</label>
      <input class="input-field" type="text" id="startTime" placeholder="00:00" oninput="syncTimeline()"/>
    </div>
    <div class="time-input-wrap">
      <label>結束時間</label>
      <input class="input-field" type="text" id="endTime" placeholder="00:30" oninput="syncTimeline()"/>
    </div>
  </div>

  <!-- Visual timeline -->
  <div class="timeline-wrap" id="timelineWrap">
    <div class="timeline-bar-outer" id="timelineBar"
         onmousedown="startDrag(event)" onmousemove="moveDrag(event)" onmouseup="endDrag(event)"
         onmouseleave="endDrag(event)">
      <div class="timeline-bg" id="timelineBg"></div>
      <div class="timeline-selection" id="timelineSel" style="left:0%;width:100%"></div>
    </div>
    <div class="timeline-hint">拖曳以選擇區間，或直接輸入時間</div>
  </div>
</div>

<!-- ── Convert Card ── -->
<div class="card">
  <div class="card-title">🚀 轉換與下載</div>
  <div class="convert-section">
    <button class="btn btn-success" id="convertBtn" onclick="startConvert()" disabled>
      ⬇️ 轉換並下載 MP3
    </button>
  </div>
  <div class="status-box" id="convertStatus"></div>
</div>

<footer>由 ffmpeg + yt-dlp 提供技術支援｜檔案在處理後自動刪除</footer>

<script>
  // ── State ─────────────────────────────────────────────────────────────────
  let currentTab = 'file';
  let uploadedFileId = null;
  let mediaDuration = 0;  // seconds
  let mediaTitle = '';

  // Drag state for timeline
  let dragging = false;
  let dragStartX = 0;
  let dragStartPct = 0;
  let dragEndPct = 1;
  let whichHandle = null; // 'start' | 'end' | 'body'

  // ── Helpers ───────────────────────────────────────────────────────────────
  function formatTime(sec) {
    if (!sec && sec !== 0) return '00:00';
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function parseTime(str) {
    if (!str) return null;
    const parts = str.trim().split(':').map(Number);
    if (parts.some(isNaN)) return null;
    if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    return parts[0];
  }

  function showStatus(elId, type, msg) {
    const el = document.getElementById(elId);
    el.className = 'status-box visible ' + type;
    if (type === 'loading') {
      el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
    } else {
      const icons = { error: '❌', 'success-msg': '✅' };
      el.innerHTML = `<span>${icons[type] || ''}</span><span>${msg}</span>`;
    }
  }
  function hideStatus(elId) {
    document.getElementById(elId).className = 'status-box';
  }

  function setMediaReady(duration, title) {
    mediaDuration = duration;
    mediaTitle = title;
    buildTimeline();
    document.getElementById('convertBtn').disabled = false;
    // If trim enabled, update end time default
    if (document.getElementById('trimToggle').checked) {
      document.getElementById('endTime').placeholder = formatTime(duration);
    }
  }

  // ── Tab switching ─────────────────────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    uploadedFileId = null;
    mediaDuration = 0;
    document.getElementById('convertBtn').disabled = true;

    document.getElementById('tabFile').className = 'tab' + (tab === 'file' ? ' active' : '');
    document.getElementById('tabYt').className = 'tab' + (tab === 'youtube' ? ' active' : '');
    document.getElementById('panelFile').style.display = tab === 'file' ? '' : 'none';
    document.getElementById('panelYt').style.display = tab === 'youtube' ? '' : 'none';
    document.getElementById('fileInfo').className = 'media-info';
    document.getElementById('ytInfo').className = 'media-info';
    hideStatus('ytStatus');
  }

  // ── File Upload ───────────────────────────────────────────────────────────
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.add('dragover');
  }
  function onDragLeave(e) {
    document.getElementById('dropZone').classList.remove('dragover');
  }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  }
  function handleFileSelect(input) {
    if (input.files[0]) uploadFile(input.files[0]);
  }

  async function uploadFile(file) {
    const dz = document.getElementById('dropZone');
    dz.querySelector('p').textContent = `正在上傳 ${file.name}…`;
    document.getElementById('convertBtn').disabled = true;

    const form = new FormData();
    form.append('file', file);

    try {
      const r = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);

      uploadedFileId = data.fileId;
      document.getElementById('fileName').textContent = data.originalName;
      document.getElementById('fileDur').textContent = '時長：' + formatTime(data.duration);
      document.getElementById('fileInfo').className = 'media-info visible';
      dz.querySelector('p').innerHTML = '<strong>點擊選擇</strong>或拖曳檔案至此';
      setMediaReady(data.duration, data.originalName.replace(/\.[^.]+$/, ''));
    } catch (err) {
      dz.querySelector('p').innerHTML = '<strong>點擊選擇</strong>或拖曳檔案至此';
      alert('上傳失敗：' + err.message);
    }
  }

  // ── YouTube ───────────────────────────────────────────────────────────────
  async function fetchYtInfo() {
    const url = document.getElementById('ytUrl').value.trim();
    if (!url) return alert('請輸入 YouTube URL');

    showStatus('ytStatus', 'loading', '正在取得影片資訊…');
    document.getElementById('ytInfo').className = 'media-info';
    document.getElementById('convertBtn').disabled = true;

    try {
      const r = await fetch('/api/youtube-info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);

      document.getElementById('ytThumb').src = data.thumbnail || '';
      document.getElementById('ytTitle').textContent = data.title;
      document.getElementById('ytDur').textContent = '時長：' + formatTime(data.duration);
      document.getElementById('ytInfo').className = 'media-info visible';
      hideStatus('ytStatus');
      setMediaReady(data.duration, data.title);
    } catch (err) {
      showStatus('ytStatus', 'error', err.message);
    }
  }

  // ── Trim toggle ───────────────────────────────────────────────────────────
  function toggleTrim(cb) {
    const ri = document.getElementById('rangeInputs');
    const tw = document.getElementById('timelineWrap');
    if (cb.checked) {
      ri.className = 'range-inputs visible';
      if (mediaDuration > 0) {
        tw.className = 'timeline-wrap visible';
        document.getElementById('startTime').value = '00:00';
        document.getElementById('endTime').value = formatTime(mediaDuration);
        dragStartPct = 0; dragEndPct = 1;
        updateSelectionBar();
      }
    } else {
      ri.className = 'range-inputs';
      tw.className = 'timeline-wrap';
    }
  }

  // ── Timeline ──────────────────────────────────────────────────────────────
  function buildTimeline() {
    const bg = document.getElementById('timelineBg');
    bg.innerHTML = '';
    const count = 60;
    for (let i = 0; i < count; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      // Randomish height for visual effect
      const h = 20 + Math.abs(Math.sin(i * 0.7 + 1.3) * 22 + Math.cos(i * 1.1) * 14);
      bar.style.height = Math.round(h) + '%';
      bg.appendChild(bar);
    }
    if (document.getElementById('trimToggle').checked) {
      document.getElementById('timelineWrap').className = 'timeline-wrap visible';
    }
  }

  function updateSelectionBar() {
    const sel = document.getElementById('timelineSel');
    sel.style.left = (dragStartPct * 100).toFixed(2) + '%';
    sel.style.width = ((dragEndPct - dragStartPct) * 100).toFixed(2) + '%';
  }

  function pctToTime(pct) {
    return Math.round(pct * mediaDuration);
  }

  function startDrag(e) {
    if (mediaDuration <= 0) return;
    dragging = true;
    const rect = document.getElementById('timelineBar').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

    // Determine if near start or end handle
    const startDist = Math.abs(pct - dragStartPct);
    const endDist = Math.abs(pct - dragEndPct);
    if (startDist < 0.05) whichHandle = 'start';
    else if (endDist < 0.05) whichHandle = 'end';
    else {
      // New selection
      whichHandle = 'end';
      dragStartPct = pct;
      dragEndPct = pct;
    }
    dragStartX = e.clientX;
    updateFromDrag(e);
  }

  function moveDrag(e) {
    if (!dragging) return;
    updateFromDrag(e);
  }

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    updateFromDrag(e);
  }

  function updateFromDrag(e) {
    const rect = document.getElementById('timelineBar').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

    if (whichHandle === 'start') {
      dragStartPct = Math.min(pct, dragEndPct - 0.01);
    } else {
      dragEndPct = Math.max(pct, dragStartPct + 0.01);
    }

    updateSelectionBar();
    document.getElementById('startTime').value = formatTime(pctToTime(dragStartPct));
    document.getElementById('endTime').value = formatTime(pctToTime(dragEndPct));
  }

  function syncTimeline() {
    if (mediaDuration <= 0) return;
    const s = parseTime(document.getElementById('startTime').value);
    const e = parseTime(document.getElementById('endTime').value);
    if (s != null) dragStartPct = Math.max(0, Math.min(1, s / mediaDuration));
    if (e != null) dragEndPct = Math.max(0, Math.min(1, e / mediaDuration));
    updateSelectionBar();
  }

  // ── Convert ───────────────────────────────────────────────────────────────
  async function startConvert() {
    const btn = document.getElementById('convertBtn');
    btn.disabled = true;
    showStatus('convertStatus', 'loading', '正在轉換，請稍候…（YouTube 影片可能需要較長時間）');

    const trimEnabled = document.getElementById('trimToggle').checked;
    let startSec = null, endSec = null;
    if (trimEnabled) {
      startSec = parseTime(document.getElementById('startTime').value) ?? 0;
      endSec = parseTime(document.getElementById('endTime').value);
      if (endSec !== null && endSec <= startSec) {
        showStatus('convertStatus', 'error', '結束時間必須大於開始時間');
        btn.disabled = false;
        return;
      }
    }

    const body = {
      type: currentTab,
      startSec: trimEnabled ? startSec : null,
      endSec: trimEnabled ? endSec : null,
      title: mediaTitle || 'output'
    };
    if (currentTab === 'file') {
      if (!uploadedFileId) {
        showStatus('convertStatus', 'error', '請先上傳檔案');
        btn.disabled = false;
        return;
      }
      body.fileId = uploadedFileId;
    } else {
      const url = document.getElementById('ytUrl').value.trim();
      if (!url) {
        showStatus('convertStatus', 'error', '請輸入 YouTube URL 並取得資訊');
        btn.disabled = false;
        return;
      }
      body.url = url;
    }

    try {
      const r = await fetch('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!r.ok) {
        const err = await r.json();
        throw new Error(err.error || '未知錯誤');
      }

      // Trigger download
      const blob = await r.blob();
      const url2 = URL.createObjectURL(blob);
      const a = document.createElement('a');
      // Get filename from header if available
      const disp = r.headers.get('Content-Disposition') || '';
      let fname = (mediaTitle || 'output') + '.mp3';
      const match = disp.match(/filename\*=UTF-8''(.+)/);
      if (match) fname = decodeURIComponent(match[1]);
      a.href = url2;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url2);

      showStatus('convertStatus', 'success-msg', `下載完成！檔案：${fname}`);
    } catch (err) {
      showStatus('convertStatus', 'error', '轉換失敗：' + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  // Init
  buildTimeline();
</script>
</body>
</html>
