services:
  - type: web
    name: cat-puzzle
    env: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mp3-converter
    env: node
    region: singapore
    plan: free
    rootDir: mp3-converter
    buildCommand: npm install && mkdir -p bin && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp && chmod +x bin/yt-dlp
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: YTDLP_PATH
        value: ./bin/yt-dlp
